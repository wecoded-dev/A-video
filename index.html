<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultra Premium Markdown Previewer</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Lenis CSS -->
  <link href="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.38/bundled/lenis.css" rel="stylesheet" />

  <!-- Highlight.js style (minimal, black/white leaning) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Three.js Background Canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Top Nav / Header -->
  <nav class="navbar navbar-expand-lg navbar-dark py-3 bg-transparent position-sticky top-0" style="z-index: 20;">
    <div class="container-fluid">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <span class="material-symbols-outlined">draw</span>
        <span class="brand-title">Markdown Atelier</span>
      </span>
      <div class="d-flex align-items-center gap-2">
        <button id="btn-copy-md" class="btn btn-outline-light btn-sm glassy-btn">
          <span class="material-symbols-outlined align-middle">content_copy</span>
          <span class="d-none d-sm-inline">Copy MD</span>
        </button>
        <button id="btn-copy-html" class="btn btn-outline-light btn-sm glassy-btn">
          <span class="material-symbols-outlined align-middle">html</span>
          <span class="d-none d-sm-inline">Copy HTML</span>
        </button>
        <button id="btn-download-html" class="btn btn-light btn-sm glassy-btn text-dark">
          <span class="material-symbols-outlined align-middle">download</span>
          <span class="d-none d-sm-inline">Download HTML</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container-fluid px-3 px-md-4 pb-5">
    <div class="row g-4 align-items-stretch mt-1">
      <!-- Editor Panel -->
      <div class="col-12 col-xl-6">
        <section class="panel glassy h-100 d-flex flex-column">
          <header class="panel-header">
            <div class="d-flex align-items-center gap-2">
              <span class="material-symbols-outlined">edit</span>
              <h2 class="m-0">Editor</h2>
            </div>
            <div class="d-flex gap-2">
              <button id="btn-clear" class="btn btn-outline-light btn-sm glassy-btn">
                <span class="material-symbols-outlined">backspace</span>
              </button>
              <button id="btn-paste" class="btn btn-outline-light btn-sm glassy-btn">
                <span class="material-symbols-outlined">content_paste</span>
              </button>
            </div>
          </header>
          <div class="panel-body flex-grow-1">
            <textarea id="editor" class="editor-textarea" spellcheck="false" aria-label="Markdown editor"></textarea>
          </div>
          <footer class="panel-footer small text-secondary">
            Paste, type, or drop a .md file here. Live preview on the right.
          </footer>
        </section>
      </div>

      <!-- Preview Panel -->
      <div class="col-12 col-xl-6">
        <section class="panel glassy h-100 d-flex flex-column">
          <header class="panel-header">
            <div class="d-flex align-items-center gap-2">
              <span class="material-symbols-outlined">visibility</span>
              <h2 class="m-0">Preview</h2>
            </div>
            <div class="d-flex gap-2">
              <button id="btn-scroll-top" class="btn btn-outline-light btn-sm glassy-btn" title="Smooth scroll to top">
                <span class="material-symbols-outlined">vertical_align_top</span>
              </button>
            </div>
          </header>
          <div id="preview-wrapper" class="panel-body flex-grow-1">
            <article id="preview" class="markdown-body"></article>
          </div>
          <footer class="panel-footer small text-secondary d-flex justify-content-between">
            <span id="render-stats">Ready</span>
            <span>Black & White • Glass</span>
          </footer>
        </section>
      </div>
    </div>
  </main>

  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Anime.js -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
  <!-- Velocity.js -->
  <script src="https://cdn.jsdelivr.net/npm/velocity-animate@2.0.6/velocity.min.js"></script>
  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <!-- Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.38/bundled/lenis.min.js"></script>
  <!-- Markdown-It core -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
  <!-- Markdown-It plugins -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@3.0.0/dist/markdown-it-emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-sub@1.0.0/dist/markdown-it-sub.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-sup@1.0.0/dist/markdown-it-sup.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-mark@3.0.1/dist/markdown-it-mark.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-ins@3.0.1/dist/markdown-it-ins.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-attrs@4.1.6/markdown-it-attrs.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-container@3.0.0/dist/markdown-it-container.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-anchor@8.6.7/dist/markdownItAnchor.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-toc-done-right@4.2.0/dist/markdown-it-toc-done-right.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-katex@2.0.3/dist/markdown-it-katex.min.js"></script>

  <!-- KaTeX core -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Highlight.js core -->
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>

  <!-- App -->
  <script src="./app.js"></script>
</body>
</html>
